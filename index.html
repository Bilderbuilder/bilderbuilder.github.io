<!<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine Foto-Galerie</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #111;
            color: #fff;
            margin: 0;
            padding: 40px;
            text-align: center;
        }
        h1 { margin-bottom: 10px; }
        p.subtitle { color: #888; margin-bottom: 40px; }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background: #222;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: transform 0.2s;
            cursor: pointer;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        /* Neuer Container für das Bild in der Kachel */
        .img-container {
            width: 100%;
            height: 250px; /* Feste Höhe für die Kachel */
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #000; /* Hintergrund bei Hochformat-Bildern */
        }
        .card img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; /* Wichtig: Bild wird eingepasst, nicht verzerrt */
        }
        .card p {
            padding: 15px;
            margin: 0;
            color: #ccc;
            font-size: 14px;
        }

        /* Styles für die Lightbox (das Vollbild) */
        #lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            cursor: zoom-out;
            padding: 40px;
            box-sizing: border-box;
        }
        #lightbox img {
            max-width: 90%;
            max-height: 90%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            border: 2px solid #fff;
        }
    </style>
</head>
<body>

    <h1>BilderBuilder</h1>
    <p class="subtitle">Willkommen auf meiner persönlichen Fotoseite.</p>

    <div class="gallery">
        <!-- BEISPIEL 1: Querformat -->
        <div class="card" onclick="openLightbox('dein-bild-1.jpg')">
            <div class="img-container">
                <img src="P1010021_ergebnis.jpg" alt="Beschreibung Bild 1">
            </div>
            
        </div>
 <div class="gallery">
        <!-- BEISPIEL 1: Querformat -->
        <div class="card" onclick="openLightbox('dein-bild-1.jpg')">
            <div class="img-container">
                <img src="P1010026_ergebnis.jpg" alt="Beschreibung Bild 1">
            </div>
            </div>        

        <!-- BEISPIEL 2: Hochformat (passt sich automatisch an) -->
        <div class="card" onclick="openLightbox('dein-bild-2.jpg')">
            <div class="img-container">
                <img src="dein-bild-2.jpg" alt="Beschreibung Bild 2">
            </div>
            <p>Titel des zweiten Bildes (Hochformat)</p>
        </div>

        <!-- Füge hier weitere Blöcke nach demselben Schema hinzu -->

    </div>

    <!-- Das Lightbox-Element, das per Klick geöffnet wird -->
    <div id="lightbox" onclick="closeLightbox()">
        <img id="lightbox-img" src="" alt="">
    </div>

    <script>
        // JavaScript-Funktionen für die Lightbox
        function openLightbox(imgSrc) {
            var lightbox = document.getElementById('lightbox');
            var img = document.getElementById('lightbox-img');
            img.src = imgSrc;
            lightbox.style.display = 'block';
            document.body.style.overflow = 'hidden'; // Verhindert Scrollen im Hintergrund
        }

        function closeLightbox() {
            var lightbox = document.getElementById('lightbox');
            lightbox.style.display = 'none';
            document.body.style.overflow = ''; // Erlaubt Scrollen wieder
        }
    </script>

</body>
</html>
