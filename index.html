<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine Foto-Galerie</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #111;
            color: #fff;
            margin: 0;
            padding: 80px 20px;
            text-align: center;
        }
        h1 { margin-bottom: 10px; font-size: 36px; }
        p.subtitle { color: #888; margin-bottom: 50px; font-size: 18px; }
        
        .gallery-grid {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            max-width: 1000px;
            margin: 0 auto;
        }
        
        /* Das Vorschau-Kärtchen für die Galerie */
        .album-card {
            background: #222;
            border-radius: 10px;
            overflow: hidden;
            width: 320px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: transform 0.2s;
            text-decoration: none;
            color: #fff;
            display: block;
        }
        .album-card:hover {
            transform: translateY(-5px);
        }
        .album-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background-color: #000;
        }
        .album-title {
            padding: 20px;
            font-size: 18px;
            font-weight: bold;
            margin: 0;
        }
    </style>
</head>
<body>

    <h1>Meine Foto-Galerie</h1>
    <p class="subtitle>Willkommen auf meiner persönlichen Fotoseite.</p>

    <div class="gallery-grid">
        <!-- Link zur Frankreich-Unterseite -->
        <a href="frankreich 2026.html" class="album-card">
            <!-- Ersetze bild-6.jpg durch eines deiner Querformat-Bilder als Titelbild -->
            <img src="P1010172_ergebnis.jpg" alt="Frankreich 2026" class="album-img">
            <h2 class="album-title">Frankreich 2026</h2>
        </a>

        <!-- Später kannst du hier ganz einfach weitere Alben hinzufügen:
        <a href="naechste-reise.html" class="album-card">
            <img src="anderes-bild.jpg" alt="Andere Reise" class="album-img">
            <h2 class="album-title">Andere Reise 2026</h2>
        </a>
        -->
    </div>

</body>
</html>
