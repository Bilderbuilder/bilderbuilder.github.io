<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BilderBuilder</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #111;
            color: #fff;
            margin: 0;
            padding: 80px 20px;
            text-align: center;
        }
        h1 { margin-bottom: 10px; font-size: 36px; }
        p.subtitle { color: #888; margin-bottom: 50px; font-size: 18px; }
        
        .gallery-grid {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            max-width: 1000px;
            margin: 0 auto;
        }
        
        /* Das Vorschau-Kärtchen für die Galerie */
        .album-card {
            background: #222;
            border-radius: 10px;
            overflow: hidden;
            width: 320px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: transform 0.2s;
            text-decoration: none;
            color: #fff;
            display: block;
        }
        .album-card:hover {
            transform: translateY(-5px);
        }
        .album-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background-color: #000;
        }
        .album-title {
            padding: 20px;
            font-size: 18px;
            font-weight: bold;
            margin: 0;
        }
    </style>
</head>
<body>
    <!-- Header mit Titel links und Logo rechts -->
    <!-- Header mit Titel links und Logo rechts -->
    <header style="max-width: 1000px; margin: 20px auto; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 20px;">
        
        <!-- Linke Seite: Titel "BilderBuilder" -->
        <div style="font-size: 1.5rem; font-weight: bold; color: #fff; letter-spacing: 1px;">
            BilderBuilder
        </div>

        <!-- Rechte Seite: Dein neues Logo -->
        <div style="display: flex; align-items: center;">
            <img src="logo-mann-gespiegelt.png" alt="Logo" style="height: 40px; width: auto; filter: brightness(0) invert(1);">
        </div>
    </header>

    <!-- Der Rest der Seite (Intro, Galerie, etc.) bleibt unverändert -->

    <!-- Einleitungstext -->
    <section style="max-width: 800px; margin: 40px auto; padding: 0 20px; text-align: center;">
        <h1 style="font-size: 2rem; margin-bottom: 15px; color: #fff;">Willkommen auf meiner Foto-Seite</h1>
        <p style="font-size: 1.1rem; line-height: 1.6; color: #aaa;">
            Hier nehme ich dich mit auf meine visuellen Reisen und Streifzüge.
        </p>
    </section>

    <div class="gallery-grid">
        <!-- Link zur Frankreich-Unterseite -->
        <a href="Frankreich-2026.html" class="album-card">
            <!-- Ersetze bild-6.jpg durch eines deiner Querformat-Bilder als Titelbild -->
           <img src="bilder/Image90.jpg" alt="Frankreich 2026" class="album-img">
            <h2 class="album-title">Frankreich 2026</h2>
        </a>

        <!-- Später kannst du hier ganz einfach weitere Alben hinzufügen:
        <a href="naechste-reise.html" class="album-card">
            <img src="anderes-bild.jpg" alt="Andere Reise" class="album-img">
            <h2 class="album-title">Andere Reise 2026</h2>
        </a>
        -->
    </div>

</body>
</html>
