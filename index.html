<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine Foto-Galerie</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #111;
            color: #fff;
            margin: 0;
            padding: 40px;
            text-align: center;
        }
        h1 { margin-bottom: 10px; }
        p { color: #888; margin-bottom: 40px; }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background: #222;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }
        .card p {
            padding: 15px;
            margin: 0;
            color: #ccc;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h1>Meine Foto-Galerie</h1>
    <p>Willkommen auf meiner persönlichen Fotoseite.</p>

   <div class="gallery">
            <div class="card">
            <img src="P1010021_ergebnis.jpg" alt="Beschreibung Bild 1">
            <p>Titel des ersten Bildes</p>
        </div>

        <!-- Bild 2 -->
        <div class="card">
            <img src="P1010026_ergebnis.jpg" alt="Beschreibung Bild 2">
            <p>Titel des zweiten Bildes</p>
        </div>
       
        <div class="card">
            <img src="P1010032_ergebnis.jpg" alt="Beschreibung Bild 3">
            <p>Titel des dritten Bildes</p>
        </div>
       
    <div class="card">
            <img src="P1010046_ergebnis.jpg" alt="Beschreibung Bild 4">
            <p>Titel des vierten Bildes</p
        </div>
       
        <div class="card">
            <img src="P1010078_ergebnis.jpg" alt="Beschreibung Bild 5">
            <p>Titel des fünften Bildes</p>
        </div>
       
       <div class="card">
            <img src="P1010103_ergebnis.jpg" alt="Beschreibung Bild 6">
            <p>Titel des sechsten Bildes</p>
        </div>
       
      <div class="card">
            <img src="P1010128_ergebnis.jpg" alt="Beschreibung Bild 6">
            <p>Titel des sechsten Bildes</p>
        </div> 
   </div>

</body>
</html>
