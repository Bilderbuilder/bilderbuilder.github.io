<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine Foto-Galerie</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #111;
            color: #fff;
            margin: 0;
            padding: 40px;
            text-align: center;
        }
        h1 { margin-bottom: 10px; }
        p { color: #888; margin-bottom: 40px; }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background: #222;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }
        .card p {
            padding: 15px;
            margin: 0;
            color: #ccc;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h1>Meine Foto-Galerie</h1>
    <p>Willkommen auf meiner persönlichen Fotoseite.</p>

    <div class="gallery">
        <!-- Beispiel-Karte -->
        <div class="card">
            <!-- Hier kommen später deine Bild-Links rein -->
            <div style="height: 200px; background: #333; display: flex; align-items: center; justify-content: center; color: #777;">Platzhalter Bild 1</div>
            <p>Titel oder Kategorie der Galerie</p>
        </div>
    </div>

</body>
</html>
