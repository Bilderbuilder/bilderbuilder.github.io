<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frankreich 2026 - Meine Foto-Galerie</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #111;
            color: #fff;
            margin: 0;
            padding: 40px;
            text-align: center;
        }
        h1 { margin-bottom: 10px; }
        p.subtitle { color: #888; margin-bottom: 40px; }
        .back-link {
            display: inline-block;
            margin-bottom: 30px;
            color: #aaa;
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover { color: #fff; }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background: #222;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: transform 0.2s;
            cursor: pointer;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .img-container {
            width: 100%;
            height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #000;
        }
        .card img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* Lightbox (Vollbild) */
        #lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            box-sizing: border-box;
            align-items: center;
            justify-content: center;
        }
       #lightbox img {
            max-width: 95%;
            max-height: 95vh;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            border: 1px solid #fff;
            object-fit: contain;
        }

        /* Mobile Optimierung für die Galerie & Lightbox */
        @media (max-width: 600px) {
            body {
                padding: 15px;
            }
            .gallery {
                grid-template-columns: 1fr;
                gap: 15px;
            }
            .lightbox-nav {
                padding: 10px 12px;
                font-size: 20px;
            }
            #prev-btn { left: 10px; }
            #next-btn { right: 10px; }
            .lightbox-close {
                top: 10px;
                right: 15px;
                font-size: 30px;
            }
        }
        
        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            font-size: 30px;
            padding: 15px 20px;
            cursor: pointer;
            border-radius: 5px;
            transition: background 0.2s;
            z-index: 1001;
        }
        .lightbox-nav:hover { background: rgba(255, 255, 255, 0.4); }
        #prev-btn { left: 30px; }
        #next-btn { right: 30px; }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 30px;
            background: none;
            border: none;
            color: white;
            font-size: 40px;
            cursor: pointer;
            z-index: 1001;
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-link">&larr; Zurück zur Startseite</a>

    <h1>Frankreich 2026</h1>
    <p class="subtitle" id="status-text">Lade Bilder...</p>

    <!-- Das Raster wird hier per JavaScript automatisch befüllt -->
    <div class="gallery" id="gallery-grid"></div>

    <!-- Lightbox-Overlay -->
    <div id="lightbox" onclick="handleLightboxClick(event)">
        <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
        <button class="lightbox-nav" id="prev-btn" onclick="changeImage(-1, event)">&#10094;</button>
        <img id="lightbox-img" src="" alt="Vollbild">
        <button class="lightbox-nav" id="next-btn" onclick="changeImage(1, event)">&#10095;</button>
    </div>

    <script>
        // TRAGE HIER DEINEN GITHUB-BENUTZERNAMEN UND DEN REPOSITORY-NAMEN EIN:
        const githubUser = "Bilderbuilder";
        const repoName = "bilderbuilder.github.io";
        const folderName = "bilder"; // Name deines Bildordners

        let images = [];
        let currentIndex = 0;

        // Bilder automatisch von GitHub abrufen
        async function loadGallery() {
            const apiURL = `https://api.github.com/repos/${githubUser}/${repoName}/contents/${folderName}`;
            
            try {
                const response = await fetch(apiURL);
                const data = await response.json();
                
                // Filtere nur Bilddateien (.jpg, .jpeg, .png) heraus
                images = data
                    .filter(item => item.type === "file" && /\.(jpg|jpeg|png)$/i.test(item.name))
                    .map(item => item.download_url); // Nutzt direkt die direkten Bild-Links von GitHub

                const grid = document.getElementById('gallery-grid');
                const statusText = document.getElementById('status-text');

                if (images.length === 0) {
                    statusText.innerText = "Keine Bilder in diesem Ordner gefunden.";
                    return;
                }

                statusText.innerText = `Eindrücke unserer Reise (${images.length} Bilder).`;
                grid.innerHTML = "";

                // Generiere für jedes Bild automatisch eine Kachel
                images.forEach((imgUrl, index) => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.onclick = () => openLightbox(index);
                    
                    card.innerHTML = `
                        <div class="img-container">
                            <img src="${imgUrl}" alt="Bild ${index + 1}" loading="lazy">
                        </div>
                    `;
                    grid.appendChild(card);
                });

            } catch (error) {
                console.error("Fehler beim Laden der Bilder:", error);
                document.getElementById('status-text').innerText = "Fehler beim Laden der Galerie.";
            }
        }

        function openLightbox(index) {
            currentIndex = index;
            updateLightboxImage();
            document.getElementById('lightbox').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
            document.body.style.overflow = '';
        }

        function changeImage(direction, event) {
            if (event) event.stopPropagation();
            currentIndex += direction;
            
            if (currentIndex >= images.length) {
                currentIndex = 0;
            } else if (currentIndex < 0) {
                currentIndex = images.length - 1;
            }
            
            updateLightboxImage();
        }

        function updateLightboxImage() {
            document.getElementById('lightbox-img').src = images[currentIndex];
        }

        function handleLightboxClick(event) {
            if (event.target.id === 'lightbox') {
                closeLightbox();
            }
        }

        document.addEventListener('keydown', function(event) {
            var lightbox = document.getElementById('lightbox');
            if (lightbox.style.display === 'flex') {
                if (event.key === 'ArrowRight') {
                    changeImage(1);
                } else if (event.key === 'ArrowLeft') {
                    changeImage(-1);
                } else if (event.key === 'Escape') {
                    closeLightbox();
                }
            }
        });

        // Startet das Laden beim Aufrufen der Seite
        loadGallery();
    </script>

</body>
</html>
