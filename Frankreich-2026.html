<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frankreich 2026 - Meine Foto-Galerie</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #111;
            color: #fff;
            margin: 0;
            padding: 40px;
            text-align: center;
        }
        h1 { margin-bottom: 10px; }
        p.subtitle { color: #888; margin-bottom: 40px; }
        .back-link {
            display: inline-block;
            margin-bottom: 30px;
            color: #aaa;
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover { color: #fff; }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background: #222;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: transform 0.2s;
            cursor: pointer;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .img-container {
            width: 100%;
            height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #000;
        }
        .card img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* Lightbox (Vollbild) */
        #lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            box-sizing: border-box;
            align-items: center;
            justify-content: center;
        }
        #lightbox img {
            max-width: 85%;
            max-height: 85vh;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            border: 2px solid #fff;
            object-fit: contain;
        }
        
        /* Navigations-Pfeile in der Lightbox */
        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            font-size: 30px;
            padding: 15px 20px;
            cursor: pointer;
            border-radius: 5px;
            transition: background 0.2s;
            z-index: 1001;
        }
        .lightbox-nav:hover {
            background: rgba(255, 255, 255, 0.4);
        }
        #prev-btn { left: 30px; }
        #next-btn { right: 30px; }

        /* Schließen-Kreuz oben rechts */
        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 30px;
            background: none;
            border: none;
            color: white;
            font-size: 40px;
            cursor: pointer;
            z-index: 1001;
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-link">&larr; Zurück zur Startseite</a>

    <h1>Frankreich 2026</h1>
    <p class="subtitle">Eindrücke unserer Reise.</p>

    <div class="gallery">

        <!-- Bild 1 -->
        <div class="card" onclick="openLightbox(0)">
            <div class="img-container">
                <img src="P1010021_ergebnis.jpg" alt="Bild 1">
            </div>
        </div>

        <!-- Bild 2 -->
        <div class="card" onclick="openLightbox(1)">
            <div class="img-container">
                <img src="P1010026_ergebnis.jpg" alt="Bild 2">            
            </div>
        </div>

        <!-- Bild 3 -->
        <div class="card" onclick="openLightbox(2)">
            <div class="img-container">
                <img src="P1010046_ergebnis.jpg" alt="Bild 3">
            </div>
        </div>

        <!-- Bild 4 -->
        <div class="card" onclick="openLightbox(3)">
            <div class="img-container">
                <img src="P1010078_ergebnis.jpg" alt="Bild 4">
            </div>
        </div>

        <!-- Bild 5 -->
        <div class="card" onclick="openLightbox(4)">
            <div class="img-container">
                <img src="P1010103_ergebnis.jpg" alt="Bild 5">
            </div>
       </div>

        <!-- Bild 6 -->
        <div class="card" onclick="openLightbox(5)">
            <div class="img-container">
                <img src="P1010128_ergebnis.jpg" alt="Bild 6">
            </div>
       </div>

        <!-- Bild 7 -->
        <div class="card" onclick="openLightbox(6)">
            <div class="img-container">
                <img src="P1010155_ergebnis.jpg" alt="Bild 7">
            </div>
         </div>

        <!-- Bild 8 -->
        <div class="card" onclick="openLightbox(7)">
            <div class="img-container">
                <img src="P1010172_ergebnis.jpg" alt="Bild 8">
            </div>
        </div>

        <!-- Bild 9 -->
        <div class="card" onclick="openLightbox(8)">
            <div class="img-container">
                <img src="P1010237_ergebnis.jpg" alt="Bild 9">
            </div>
         </div>

    </div>

    <!-- Lightbox-Overlay mit Buttons -->
    <div id="lightbox" onclick="handleLightboxClick(event)">
        <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
        <button class="lightbox-nav" id="prev-btn" onclick="changeImage(-1, event)">&#10094;</button>
        <img id="lightbox-img" src="" alt="Vollbild">
        <button class="lightbox-nav" id="next-btn" onclick="changeImage(1, event)">&#10095;</button>
    </div>

    <script>
        // Liste aller Bilddateien in exakt derselben Reihenfolge wie oben
        const images = [
            "P1010021_ergebnis.jpg",
            "P1010026_ergebnis.jpg",
            "P1010046_ergebnis.jpg",
            "P1010078_ergebnis.jpg",
            "P1010103_ergebnis.jpg",
            "P1010128_ergebnis.jpg",
            "P1010155_ergebnis.jpg",
            "P1010172_ergebnis.jpg",
            "P1010237_ergebnis.jpg"
        ];

        let currentIndex = 0;

        function openLightbox(index) {
            currentIndex = index;
            updateLightboxImage();
            document.getElementById('lightbox').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
            document.body.style.overflow = '';
        }

        function changeImage(direction, event) {
            if (event) event.stopPropagation(); // Verhindert, dass sich die Lightbox schließt
            currentIndex += direction;
            
            // Schleife: Am Ende wieder zum ersten Bild springen (oder umgekehrt)
            if (currentIndex >= images.length) {
                currentIndex = 0;
            } else if (currentIndex < 0) {
                currentIndex = images.length - 1;
            }
            
            updateLightboxImage();
        }

        function updateLightboxImage() {
            document.getElementById('lightbox-img').src = images[currentIndex];
        }

        // Klick außerhalb des Bildes schließt die Lightbox
        function handleLightboxClick(event) {
            if (event.target.id === 'lightbox') {
                closeLightbox();
            }
        }

        // Tastatursteuerung (Pfeiltasten links/rechts und Escape)
        document.addEventListener('keydown', function(event) {
            var lightbox = document.getElementById('lightbox');
            if (lightbox.style.display === 'flex') {
                if (event.key === 'ArrowRight') {
                    changeImage(1);
                } else if (event.key === 'ArrowLeft') {
                    changeImage(-1);
                } else if (event.key === 'Escape') {
                    closeLightbox();
                }
            }
        });
    </script>

</body>
</html>
